# Config Railway — app web Next.js (monorepo pnpm).
# Root directory du service : frontend/
# Config path absolu dans Railway : /frontend/railway.toml

[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter web build"

[deploy]
startCommand = "pnpm --filter web start -p ${PORT:-3000}"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
