# osv-scanner exceptions — per-advisory, time-boxed, NEVER a blanket bypass.
# CI gates on High/Critical only (see .github/scripts/osv_gate_high.py). Medium/Low
# are reported but tolerated, matching the previous `pnpm audit --audit-level=high`.
#
# Only findings that are BUILD/DEV-only AND have no reasonable immediate remediation
# are ignored here, each with an owner, a follow-up ticket and a short explicit expiry
# so they resurface and force re-triage. Runtime-reachable findings are NEVER ignored
# (sharp is fixed via override, not waived). New vulnerabilities are NOT covered here
# and will fail CI.
#
# There are currently NO ignored advisories. Both former entries were resolved by
# removing the vulnerable package from the tree, not by waiving it. Keep it that way:
# an exception is a last resort, and each one below would have to state why no
# remediation exists at all.

# image-size — RESOLVED, no exception (SEC-FE-04A).
# GHSA-5p2g-fcmc-qvqq (JXL/HEIF) and GHSA-w3rx-r6r6-pgpr (ICNS), CVSS 8.7 each, came
# from image-size@1.2.1 pulled by metro@0.83.3. No release of image-size fixes them.
# Metro inlined its own image parsers and dropped the dependency, backported into the
# 0.83 line at 0.83.8. Range-bounded overrides `metro-*@<0.83.8 -> 0.83.8` align the
# 0.83 family with what Expo itself ships in @expo/metro@55.1.2, leaving the 0.84
# family used elsewhere untouched.
# Locked by `apps/web/lib/metro-image-size-contract.test.ts`.

# uuid — RESOLVED, no exception (SEC-FE-04B).
# GHSA-w5hq-g745-h8pq came from uuid@7.0.3, pulled solely by xcode@3.0.1 (Expo iOS
# prebuild tooling). The advisory affects v3/v5/v6 when a `buf` is supplied; xcode
# calls only `v4()`, with no argument, once, in pbxProject.generateUuid().
# No official upgrade exists: xcode@3.0.1 is the latest published release and every
# @expo/config-plugins line, up to 58, pins `xcode: ^3.0.1`. A parent-scoped override
# `xcode@3.0.1>uuid -> 11.1.1` therefore carries the fix.
#
# The previous note here claimed uuid 11 was "incompatible with xcode@3.0.1's CommonJS
# v4 API". That was wrong: uuid@11.1.1 declares exports["."].node.require pointing at
# ./dist/cjs/index.js, and `require('uuid').v4()` resolves and runs from xcode.
# (uuid@13 would genuinely break it — no `require` condition, no `main`.)
#
# On severity: the published CVSS v3.1 vector scores integrity as I:H and yields 7.5;
# the CVSS v4.0 vector scores it VI:L with AT:P and yields a lower severity; GitHub
# labels the advisory Moderate. osv-scanner reports max_severity 7.5, so the gate
# correctly applied its 7.0 threshold. The threshold was not lowered — the dependency
# was replaced instead.
# Locked by `apps/web/lib/xcode-uuid-contract.test.ts`.
