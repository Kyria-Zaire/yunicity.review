# uuid@7.0.3 (transitive, BUILD-ONLY): apps/mobile → expo → @expo/config-plugins →
# xcode → uuid. The advisory affects uuid.v3/v5/v6 when given a buffer/offset that is not
# correctly validated (NOT a randomness weakness). Used only by the Expo/Xcode iOS prebuild
# tooling; web/admin do not import uuid at all and no app code calls v3/v5/v6. Fixed in uuid
# 11.1.1, but that is a major bump incompatible with xcode@3.0.1's CommonJS v4 API — not
# forced here. Follow-up: SEC-FE-04.
[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2026-09-15T00:00:00Z
reason = "BUILD-ONLY uuid@7.0.3 (Expo/Xcode prebuild); no app v3/v5/v6 usage; fix is a risky major 7→11. Owner: frontend. Tracked in SEC-FE-04."

# image-size: PLUS AUCUNE EXCEPTION — la dependance a ete supprimee, pas ignoree.
# GHSA-5p2g-fcmc-qvqq et GHSA-w3rx-r6r6-pgpr concernaient image-size@1.2.1, tire par
# metro@0.83.3. Metro a internalise ses propres parseurs d'images a partir de 0.83.8
# (retroportage dans la ligne 0.83) et ne depend plus du tout d'image-size. Un override
# borne par plage `metro-*@<0.83.8 -> 0.83.8` aligne la famille 0.83 sur ce que Expo
# livre lui-meme dans @expo/metro@55.1.2, sans toucher a la famille 0.84 utilisee
# ailleurs. Verrouille par `apps/web/lib/metro-image-size-contract.test.ts`. SEC-FE-04A.
