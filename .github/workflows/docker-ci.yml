name: Docker CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.qa.yml"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/tests/conftest.py"
      - "backend/pyproject.toml"
      - "infra/docker/**"
      - ".github/workflows/docker-ci.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.qa.yml"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/tests/conftest.py"
      - "backend/pyproject.toml"
      - "infra/docker/**"
      - ".github/workflows/docker-ci.yml"

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-stack:
    name: compose · health · pytest (yunicity_qa)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Explicit project + QA file for every compose call — never touch the dev stack.
      COMPOSE: docker compose -p yunicity-qa -f docker-compose.qa.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep validating the dev compose syntax without starting it.
      - name: Validate compose files
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config >/dev/null
          $COMPOSE config >/dev/null

      # Destructive fixtures run only against the dedicated, disposable yunicity_qa DB.
      - name: Start QA stack (disposable, hermetic)
        run: $COMPOSE up --build -d

      - name: Wait for QA API health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8010/api/v1/health >/dev/null 2>&1; then
              echo "QA API healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "QA API did not become healthy in time"
          $COMPOSE ps
          $COMPOSE logs backend-qa --tail 80
          exit 1

      - name: Check liveness endpoint
        run: |
          set -euo pipefail
          body=$(curl -fsS http://localhost:8010/api/v1/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Check readiness (database + redis)
        run: |
          set -euo pipefail
          body=$(curl -fsS http://localhost:8010/api/v1/ready)
          echo "$body"
          echo "$body" | grep -q '"status":"ready"'
          echo "$body" | grep -q '"database":"ok"'
          echo "$body" | grep -q '"redis":"ok"'

      # backend-qa already carries TEST_DATABASE_URL (yunicity_qa), the QA run marker,
      # JWT/pepper and neutralized providers inline — no ambiguous env injected here.
      - name: Pytest on yunicity_qa
        run: $COMPOSE exec -T backend-qa pytest

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
