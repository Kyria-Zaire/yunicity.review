name: PR Safety Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden-files:
    name: Forbidden paths & artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block secrets and local env files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|\.env\.prod$|\.pem$|\.key$|(^|/)secrets/'; then
            echo "::error::Committed forbidden secret/env files (.env, .pem, .key, secrets/)"
            exit 1
          fi
          echo "No forbidden secret paths in git index"

      - name: Block committed dependency trees
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)node_modules/|(^|/)backend/\.venv/|(^|/)frontend/node_modules/'; then
            echo "::error::Committed node_modules or .venv — use .gitignore"
            exit 1
          fi
          echo "No committed node_modules / .venv"

      - name: Block oversized tracked files (>5 MiB)
        run: |
          set -euo pipefail
          max_bytes=5242880
          large_files=""
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(stat -c%s "$file")
            if [ "$size" -gt "$max_bytes" ]; then
              large_files="${large_files}${file} (${size} bytes)\n"
            fi
          done < <(git ls-files)
          if [ -n "$large_files" ]; then
            echo "::error::Tracked files exceed 5 MiB:"
            printf "%b" "$large_files"
            exit 1
          fi
          echo "No oversized tracked files"

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          python -m venv .venv-ci-audit
          source .venv-ci-audit/bin/activate
          pip install -e ".[dev]"
          # Isolated venv: skip editable yunicity-api + avoid Ubuntu system packages (e.g. bcc).
          pip-audit --skip-editable --strict --desc --format columns

      # `pnpm audit` was retired by npm (legacy audit endpoint returns HTTP 410, and pnpm
      # has not migrated to the bulk advisory endpoint on any version). We use osv-scanner
      # instead: it reads pnpm-lock.yaml directly and queries OSV.dev (no npm endpoint), and
      # is genuinely functional (fails on real vulnerabilities). CI gates on High/Critical
      # only (CVSS >= 7.0), preserving the previous `--audit-level=high` policy; Medium/Low
      # are reported but tolerated. Per-advisory, time-boxed exceptions: frontend/osv-scanner.toml.
      - name: osv-scanner (frontend, gate on High/Critical)
        run: |
          set -euo pipefail
          OSV=/usr/local/bin/osv-scanner
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64" -o "$OSV"
          chmod +x "$OSV"
          # Human-readable report (all severities) for the log:
          "$OSV" scan source --lockfile=frontend/pnpm-lock.yaml --config=frontend/osv-scanner.toml || true
          # Machine-readable output for the High/Critical gate:
          rc=0
          "$OSV" scan source --lockfile=frontend/pnpm-lock.yaml --config=frontend/osv-scanner.toml \
            --format json > osv-frontend.json || rc=$?
          # osv-scanner: 0 = clean, 1 = vulnerabilities found (the gate decides); any other
          # code is a real tool/network error and must NOT be swallowed.
          if [ "$rc" != "0" ] && [ "$rc" != "1" ]; then
            echo "::error::osv-scanner failed to run (exit $rc)"; exit "$rc"
          fi
          python3 .github/scripts/osv_gate_high.py osv-frontend.json
