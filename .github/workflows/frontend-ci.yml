name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pas de `cache: pnpm` : setup-node l'evalue (`pnpm store path`) pendant sa propre
      # etape, avant que Corepack ait installe pnpm a l'etape suivante.
      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"

      # pnpm vient de Corepack (fourni avec ce Node), comme dans Dockerfile.web : la version
      # ET l'empreinte `+sha512` du `packageManager` de frontend/package.json (repertoire de
      # travail par defaut) sont verifiees au telechargement ; une empreinte fausse fait
      # echouer l'etape. Les etapes suivantes doivent utiliser ce pnpm-la, et aucun autre.
      - name: Setup pnpm (Corepack)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack --version
          corepack enable
          pnpm --version
          expected="$(node -p "require('./package.json').packageManager.split('+')[0].split('@')[1]")"
          test "$(pnpm --version)" = "$expected"
          test "$(command -v pnpm)" = "$(dirname "$(command -v node)")/pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Place avant le build, qui est de loin l'etape la plus lente : un test rouge doit
      # arreter le pipeline sans attendre une compilation Next complete.
      # `turbo run test` decouvre tout package portant un script `test` : rien a declarer
      # ici quand un package en gagne un. Couvre @yunicity/utils (833), admin (27) et web
      # (3) — soit la totalite des fichiers de test du frontend, sans orphelin (#138).
      - name: Test
        run: pnpm test

      - name: Clean Next build artifacts
        run: pnpm clean:next

      - name: Build
        run: pnpm build
