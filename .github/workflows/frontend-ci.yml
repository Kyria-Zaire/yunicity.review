name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Place avant le build, qui est de loin l'etape la plus lente : un test rouge doit
      # arreter le pipeline sans attendre une compilation Next complete.
      # `turbo run test` decouvre tout package portant un script `test` : rien a declarer
      # ici quand un package en gagne un. Couvre @yunicity/utils (833), admin (27) et web
      # (3) — soit la totalite des fichiers de test du frontend, sans orphelin (#138).
      - name: Test
        run: pnpm test

      - name: Clean Next build artifacts
        run: pnpm clean:next

      - name: Build
        run: pnpm build
