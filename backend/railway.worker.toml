# Config Railway — worker vidéo ARQ (creative-commitment).
# Config path absolu à renseigner dans Railway : /backend/railway.worker.toml
#
# POURQUOI CE FICHIER EXISTE
#
# L'API (powerful-abundance) et le worker (creative-commitment) partagent le même Root
# Directory (backend/). Railway auto-détecte donc backend/railway.toml pour LES DEUX, et le
# worker héritait du preDeployCommand destiné à l'API seule — soit deux `alembic upgrade
# head` concurrents à chaque déploiement des deux services. L'advisory lock d'alembic/env.py
# les sérialiserait, mais c'est un filet de sécurité : on ne crée pas la course exprès.
#
# Pointer le worker sur ce fichier remplace l'auto-détection : il ne lit plus railway.toml.
#
# POURQUOI IL EST VIDE
#
# Un champ déclaré ici écrase le réglage du dashboard ; un champ omis le conserve. Le worker
# tourne aujourd'hui correctement avec ses réglages dashboard (start command `arq
# workers.video_worker.WorkerSettings` — il partage l'image de l'API, dont le CMD lance
# uvicorn, donc cette commande est forcément un override côté service).
#
# Aucun de ces réglages n'est lisible depuis le CLI Railway. Les recopier ici reviendrait à
# déclarer des valeurs devinées sur un service de production. Ne rien déclarer garantit que
# le SEUL effet de ce fichier est de retirer au worker un preDeployCommand qu'il n'aurait
# jamais dû avoir.
#
# NE JAMAIS AJOUTER DE preDeployCommand ICI. Les migrations sont la responsabilité exclusive
# de l'API (backend/railway.toml).

[deploy]
