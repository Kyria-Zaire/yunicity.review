[project]
name = "yunicity-api"
version = "0.1.0"
description = "Yunicity API — local-first social platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Borne haute : SQLAlchemy 2.1 retire le tuple du generique (`Select[T]` au
    # lieu de `Select[tuple[T]]`), ce qui invalide les annotations 2.0 de neuf
    # repositories. Adopter 2.1 est une migration a part, pas une resolution pip.
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
    "tzdata>=2024.2",
    "boto3>=1.35.0",
    "arq>=0.26.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    # Plafond sur la MAJEURE seulement : mypy 2.x est la version verte du 24/09 et
    # celle que `uv.lock` designe. Sans plafond, une majeure future rougit la CI
    # sans qu'aucun commit ne l'ait provoquee.
    "mypy>=1.13.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "workers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["redis.*", "asyncpg.*", "jwt.*", "argon2.*", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# CI-FIX-02: disable the anyio pytest plugin so pytest-asyncio is the ONLY async test
# runner. Two runners created distinct event loops for the module-global DB engine, so
# its pooled connections were terminated on a foreign/closed loop ("attached to a
# different loop"). One runner => engine created and disposed on the same per-test loop.
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: tests requiring DATABASE_URL and PostgreSQL",
    "unit: pure unit tests without database",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
