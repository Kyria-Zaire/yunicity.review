# Config Railway — API FastAPI (powerful-abundance).
# Root directory du service : backend/
# Config path absolu à renseigner dans Railway : /backend/railway.api.toml
#
# ⚠️  À POINTER SUR LE SERVICE API UNIQUEMENT — jamais sur le worker (creative-commitment)
#     ni sur un futur service : les migrations sont la responsabilité exclusive de l'API.
#     Plusieurs services lançant `alembic upgrade head` au même déploiement se
#     percuteraient ; l'advisory lock d'alembic/env.py les sérialiserait, mais c'est un
#     filet de sécurité — pas une raison de créer la course.
#
# POURQUOI CE NOM, ET PAS railway.toml
#
# L'API et le worker partagent le même Root Directory (backend/). Railway auto-détecte un
# fichier nommé railway.toml à cet endroit, donc le worker héritait du preDeployCommand
# destiné à l'API seule. Aucun fichier ne portant plus ce nom, il n'y a plus d'héritage
# implicite possible : chaque service lit uniquement le chemin explicitement configuré.
# Ne pas renommer ce fichier en railway.toml — cela réarmerait le piège pour tout service
# rooté sur backend/, présent ou futur.
#
# Ce fichier ne déclare QUE preDeployCommand, volontairement.
#
# Un champ déclaré ici écrase le réglage du dashboard ; un champ omis le conserve. Comme
# aucun autre réglage du service n'est vérifiable depuis le CLI Railway, tout champ ajouté
# « pour faire bon compte » changerait un comportement prod non vérifié — alors que
# l'omission ne peut rien casser. En particulier :
#
#   - pas de [build]      : le builder du service n'est pas exposé par le CLI.
#   - pas de startCommand : backend/Dockerfile porte déjà le CMD, qui tourne en prod
#                           aujourd'hui. Le recopier ici en ferait une seconde source de
#                           vérité, libre de diverger en silence si le CMD change un jour.
#   - pas de restartPolicy* : réglage actuel du service non vérifié.

[deploy]
# Applique les migrations entre le build et le déploiement. Railway bloque le déploiement
# si la commande échoue : l'ancienne version continue de servir, au lieu d'une nouvelle
# version démarrée sur un schéma incohérent. C'est la raison de ne PAS mettre alembic dans
# le CMD du conteneur (échec = service qui ne démarre pas = indisponibilité).
preDeployCommand = ["/bin/sh -c 'alembic upgrade head'"]
